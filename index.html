<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SerwisMaster Pro - Naprawiony</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1329; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #1e293b; padding: 0 16px; height: 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
    .brand { font-weight: 800; font-size: 1.15rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .nav-tabs { display: flex; gap: 4px; height: 100%; align-items: center; }
    .tab-btn { background: transparent; color: #94a3b8; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.82rem; }
    .tab-btn:hover { color: #fff; background: #334155; }
    .tab-btn.active { background: #0284c7; color: #fff; }
    .view-container { display: flex; flex: 1; width: 100%; height: calc(100vh - 50px); overflow: hidden; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .box { background: #152238; border: 1px solid #2a4365; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .btn { background: #0284c7; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: #10b981; }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚙️ SerwisMaster Pro [Tryb Awaryjny & Naprawczy]</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="alert('Działa!')">Test Przycisków</button>
    </div>
  </header>

  <div class="view-container">
    <div class="content">
      <div class="box">
        <h2>Diagnostyka Aplikacji</h2>
        <p style="margin-top: 10px; color: #94a3b8;">Jeśli widzisz ten ekran, oznacza to, że przeglądarka załadowała świeży plik i JavaScript działa prawidłowo.</p>
        <button class="btn btn-green" style="margin-top: 15px;" onclick="testButton()">Kliknij, aby przetestować reakcję</button>
      </div>
    </div>
  </div>

  <script>
    // Automatyczne wyczyszczenie starego Service Workera, który blokował aktualizację!
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for(let registration of registrations) {
          registration.unregister();
          console.log('Stary Service Worker został usunięty.');
        }
      });
    }

    function testButton() {
      alert('Przycisk reaguje poprawnie! Problem z zamrożeniem został usunięty.');
    }
  </script>
</body>
</html>
